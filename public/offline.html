<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusX Offline</title>
    <meta name="theme-color" content="#050509" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050509;
        color: #fafafa;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .card {
        width: min(320px, calc(100vw - 40px));
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.04);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 22px;
      }

      p {
        color: #8b8b98;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>CampusX is offline</h1>
      <p>Check your connection and try again.</p>
    </div>
  </body>
</html>
